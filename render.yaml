services:
  - type: web
    name: agentforge-be
    runtime: python
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run fastapi run app/main.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        value: "60"
      - key: COOKIE_SECURE
        value: "true"
